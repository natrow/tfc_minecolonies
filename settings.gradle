pluginManagement {
    repositories {
        mavenLocal()
        gradlePluginPortal()
        maven { url = 'https://maven.neoforged.net/releases' }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

sourceControl {
    gitRepository(uri("https://github.com/TerraFirmaCraft/TerraFirmaCraft.git")) {
        producesModule("net.dries007.tfc:TerraFirmaCraft")
    }
}
